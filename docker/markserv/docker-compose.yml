services:
  markserv:
    build: .
    ports:
      - "127.0.0.1:8090:8080"    # Markdown preview HTTP server (SSE live-reload on /__livereload)
    environment:
      # Alert vocabulary: `gfm` (default, the five GitHub markers) or
      # `extended` (those five plus the 22 Obsidian markers that
      # render-markdown.nvim renders in-buffer).  Switching needs only a
      # container recreate -- `MD_ALERT_VOCAB=extended docker compose up -d` --
      # not an image rebuild.
      - "MD_ALERT_VOCAB=${MD_ALERT_VOCAB:-gfm}"
    volumes:
      # Mount your markdown project root into the container.
      # Override with: MD_DIR=/path/to/project docker compose up
      - "${MD_DIR:-$PWD}:/docs"
    restart: unless-stopped
